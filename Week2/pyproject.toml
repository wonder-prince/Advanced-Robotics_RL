[project]
name = "week2-deep-learning-practice"
version = "0.1.0"
description = "第 2 周深度学习基本原理实践：PyTorch、函数拟合和 MNIST"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.5.1+cu121; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "torch==2.5.1; (sys_platform != 'win32' and sys_platform != 'linux') or (platform_machine != 'x86_64' and platform_machine != 'AMD64')",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "requests>=2.31,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "(sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
package = false
