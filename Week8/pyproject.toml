[project]
name = "week8-centermask-lab"
version = "0.1.0"
description = "CenterMask inference and confidence-threshold experiments for Week8"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy==1.26.4",
    "pillow==11.0.0",
    "opencv-python-headless==4.10.0.84",
    "pycocotools==2.0.8",
    "yacs==0.1.8",
    "matplotlib==3.9.4",
    "tqdm==4.67.1",
    "scikit-image==0.24.0",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["CenterMask-master/tests/test_week8_inference.py", "CenterMask-master/tests/test_nms.py"]
pythonpath = ["CenterMask-master", "CenterMask-master/demo"]
