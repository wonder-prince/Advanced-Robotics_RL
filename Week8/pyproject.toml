[project]
name = "week8-mlagents-lab"
version = "0.1.0"
requires-python = "==3.10.12"
dependencies = [
    "mlagents==1.1.0",
    "setuptools<81",
    "torch==2.5.1",
]

[tool.uv]
package = false
override-dependencies = [
    "grpcio==1.53.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "grpcio==1.48.2; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
