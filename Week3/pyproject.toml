[project]
name = "week3-deep-reinforcement-learning-practice"
version = "0.1.0"
description = "第 3 周深度强化学习原理实践：REINFORCE、A2C、Q-Learning、DQN"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=1.1,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
reinforce = ["torch==2.5.1+cu121"]
flappy = ["torch==2.5.1+cu121", "flappy-bird-gymnasium>=0.4,<1"]
panda = ["stable-baselines3>=2.4,<3", "panda-gym>=3,<4"]
atari = ["rl-zoo3>=2.4,<3", "ale-py>=0.11,<1"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
package = false
