    { name = "rl-zoo3" },
]
flappy = [
    { name = "flappy-bird-gymnasium" },
    { name = "torch" },
]
panda = [
    { name = "panda-gym" },
    { name = "stable-baselines3" },
]
reinforce = [
    { name = "torch" },
]

[package.metadata]
requires-dist = [
    { name = "ale-py", marker = "extra == 'atari'", specifier = ">=0.11,<1" },
    { name = "flappy-bird-gymnasium", marker = "extra == 'flappy'", specifier = ">=0.4,<1" },
    { name = "gymnasium", specifier = ">=1.1,<2" },
    { name = "numpy", specifier = ">=1.26,<3" },
    { name = "panda-gym", marker = "extra == 'panda'", specifier = ">=3,<4" },
    { name = "rl-zoo3", marker = "extra == 'atari'", specifier = ">=2.4,<3" },
    { name = "stable-baselines3", marker = "extra == 'panda'", specifier = ">=2.4,<3" },
    { name = "torch", marker = "extra == 'flappy'", specifier = "==2.5.1+cu121" },
    { name = "torch", marker = "extra == 'reinforce'", specifier = "==2.5.1+cu121" },
]
provides-extras = ["reinforce", "flappy", "panda", "atari"]
