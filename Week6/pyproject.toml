[project]
name = "week6-offline-rl-practice"
version = "0.1.0"
description = "第 6 周离线强化学习实践：Pointmass 探索、DQN/CQL/AWAC/IQL、在线微调"
requires-python = ">=3.10,<3.11"
dependencies = [
    # MuJoCo 2.2.2 提供 Windows 与 Apple Silicon 的 Python 3.10 wheel。
    "gym==0.25.2",
    "mujoco==2.2.2",
    # gym 0.25.2 使用了 numpy 1.24 中被移除的 np.bool8，必须锁在 1.23.x。
    "numpy==1.23.5",
    "networkx==2.8.8",
    "torch==2.5.1+cu121; sys_platform == 'win32'",
    "torch==2.5.1; sys_platform == 'darwin'",
    "torch==2.7.1+cu128; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "tensorboardX==2.5.1",
    "matplotlib==3.7.5",
    "pillow<10",
    "opencv-python==4.9.0.80",
    "tqdm==4.66.1",
    "pyyaml==6.0.1",
    # gym.envs.mujoco 的渲染模块会 import imageio。
    "imageio==2.34.0",
    "imageio-ffmpeg==0.5.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
