[project]
name = "week5-imitation-learning-practice"
version = "0.1.0"
description = "第 5 周模仿学习实践：行为克隆与 DAgger"
requires-python = ">=3.10,<3.11"
dependencies = [
    # MuJoCo 2.2.2 提供 Windows 与 Apple Silicon 的 Python 3.10 wheel。
    "gym==0.25.2",
    "mujoco==2.2.2",
    # gym 0.25.2 使用了 numpy 1.24 中被移除的 np.bool8，必须锁在 1.23.x。
    "numpy==1.23.5",
    "torch==2.5.1+cu121; sys_platform == 'win32'",
    "torch==2.5.1; sys_platform == 'darwin'",
    "tensorboard==2.15.0",
    "opencv-python==4.9.0.80",
    # gym.envs.mujoco 的渲染模块会 import imageio。
    "imageio==2.34.0",
    "imageio-ffmpeg==0.5.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'win32'" }

[tool.uv]
package = false
# Windows uses the course CUDA wheel and Apple Silicon uses the native PyTorch wheel.
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]
